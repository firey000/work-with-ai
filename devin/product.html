<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="css/style.css"><title>Товар — ВОЛЬТ</title></head>
<body>
<main class="container">
  <div class="crumbs"></div>
  <div class="product">
    <div class="gallery"><div class="thumbs"></div><div class="main-img"></div></div>
    <div class="p-info"></div>
    <aside class="buy-box"></aside>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab-btns"><button class="active" data-tab="desc">Описание</button><button data-tab="specs">Характеристики</button><button data-tab="reviews">Отзывы</button></div>
    <div class="tab active" id="t-desc"></div><div class="tab" id="t-specs"></div><div class="tab" id="t-reviews"></div>
  </div>
  <section><div class="sec-head"><h2>С этим товаром покупают</h2></div><div class="hscroll" id="with"></div></section>
  <section><div class="sec-head"><h2>Похожие товары</h2></div><div class="hscroll" id="similar"></div></section>
</main>
<script src="js/data.js"></script><script src="js/images.js"></script><script src="js/common.js"></script><script src="js/product.js"></script>
</body>
</html>
